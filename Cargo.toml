[workspace]
members = ["crates/spectrum-core", "crates/spectrum-driver-sa430", "src-tauri"]
resolver = "3"

[workspace.package]
version = "0.1.0"
authors = ["David Krepsky <david.m.krepsky@gmail.com>"]
edition = "2024"
license = "MIT"
rust-version = "1.94"

[workspace.dependencies]
rustfft = "6.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ts-rs = "12"
tempfile = "3"
sa430 = "0.2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
dbg_macro = "warn"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
