<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spectrum Studio - design system prototype (work 009)</title>
<style>
/* ===== 1. Real application CSS (src/styles/*.css, generated into this file; html/body/.app rules removed) ===== */
/* --- src/styles/app.css --- */
:root {
  --bg: #0b1018;
  --surface: #121a26;
  --surface-2: #182233;
  --surface-3: #1f2b3f;
  --border: #26344a;
  --text: #dbe4f0;
  --text-muted: #8a9ab1;
  --accent: #3ee0b5;
  --accent-strong: #2bc79e;
  --warn: #ffb547;
  --warn-strong: #f0a22e;
  --danger: #ff6b6b;
  /* Stop fill of the capture control while acquiring (capture.css). Ink on --danger is 6.9:1,
     on --danger-strong 5.2:1 (WCAG AA for label and icon). */
  --danger-strong: #f04848;
  --danger-ink: #120a24;
  --info: #5aa9ff;
  /* Single capture (mode colour, see design.md 3.2). Ink on the fill: --single-ink. */
  --single: #a47cff;
  --single-strong: #9166f5;
  --single-ink: #120a24;
  --radius: 6px;
  --font: 'Inter', 'Cantarell', 'Ubuntu', system-ui, sans-serif;
  --mono: 'JetBrains Mono', 'DejaVu Sans Mono', ui-monospace, monospace;
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}


button,
input,
select {
  font: inherit;
  color: inherit;
}

button {
  background: var(--surface-3);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 5px 12px;
  cursor: pointer;
  white-space: nowrap;
}
button:hover:not(:disabled) {
  border-color: #3a4d6b;
  background: #25344c;
}
button:disabled {
  opacity: 0.45;
  cursor: default;
}
button.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #062018;
  font-weight: 600;
}
button.primary:hover:not(:disabled):not([aria-disabled='true']) {
  background: var(--accent-strong);
}
button.small {
  padding: 2px 8px;
  font-size: 12px;
}
button.icon {
  padding: 0 6px;
  background: transparent;
  border-color: transparent;
  font-size: 15px;
  line-height: 1.2;
}

input[type='text'],
input[type='number'],
select,
.freq-input {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 4px 7px;
  min-width: 0;
}
input:focus-visible,
select:focus-visible,
button:focus-visible {
  outline: 2px solid var(--info);
  outline-offset: 1px;
}
input.invalid,
.freq-input.invalid {
  border-color: var(--danger);
}
input:disabled,
select:disabled {
  opacity: 0.5;
}
.freq-input {
  font-family: var(--mono);
  width: 150px;
  text-align: right;
}


/* Toolbar */
.toolbar {
  --control-height: 30px;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 7px 12px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.brand {
  flex: none;
  white-space: nowrap;
  font-weight: 700;
  letter-spacing: 0.02em;
  display: flex;
  align-items: center;
  gap: 6px;
}
.brand-mark {
  color: var(--accent);
}
.toolbar-group {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: none;
}
/* The only group that may shrink: the source name column gives way (down to the source button's
   150px minimum) so a long name never pushes the other controls or the side panel off screen.
   `min-width: 0` is needed because its min-content contains the whole, unwrapped name. */
.toolbar-source {
  flex: 0 1 auto;
  min-width: 0;
}
.toolbar-source > :not(.source-control) {
  flex: none;
}
.field {
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--text-muted);
}
.badge {
  font-size: 11px;
  padding: 1px 7px;
  border-radius: 4px;
  background: var(--surface-3);
  color: var(--text-muted);
  letter-spacing: 0.03em;
}

/* Narrow windows (the minimum is 1024px): reclaim toolbar space instead of squeezing the source
   name, so a 22-character device name such as "SA430 08FF41E50F8B3A34" stays fully visible. */
@media (max-width: 1180px) {
  .toolbar {
    gap: 10px;
    padding-left: 8px;
    padding-right: 8px;
  }
  .toolbar-group,
  .field {
    gap: 5px;
  }
  .toolbar .freq-input {
    width: 128px;
  }
  .toolbar .badge {
    padding: 1px 5px;
  }
}

/* Notices */
.notice {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 12px;
  border-bottom: 1px solid var(--border);
  background: rgba(255, 181, 71, 0.1);
}
.notice-message {
  flex: 1;
}
.notice-deviceLost,
.notice-connectFailed,
.notice-internal,
.notice-command {
  background: rgba(255, 107, 107, 0.12);
}

/* Workspace */
.workspace {
  display: grid;
  grid-template-columns: 1fr 330px;
  min-height: 0;
}
.plots {
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
  background: var(--bg);
}
.plot {
  position: relative;
  min-height: 0;
  overflow: hidden;
}
.plot canvas {
  position: absolute;
  inset: 0;
  display: block;
  cursor: crosshair;
  touch-action: none;
}
.spectrum-plot {
  flex: 1 1 0;
}
.plots.with-waterfall .spectrum-plot {
  flex: 3 1 0;
}
.waterfall {
  flex: 2 1 0;
  display: flex;
  min-height: 0;
  border-top: 1px solid var(--border);
  padding-bottom: 6px;
}
.waterfall-plot {
  flex: 1;
}
.waterfall-axis {
  flex: none;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-muted);
  font-size: 11px;
}
.waterfall-axis {
  position: relative;
}
.waterfall-axis-title {
  position: absolute;
  right: 8px;
  top: 4px;
  font-size: 11px;
  white-space: nowrap;
}
.waterfall-tick {
  position: absolute;
  right: 6px;
  transform: translateY(-50%);
  font-size: 11px;
  color: var(--text-muted);
  white-space: nowrap;
}
.waterfall-tick::after {
  content: '';
  display: inline-block;
  width: 4px;
  height: 1px;
  margin-left: 3px;
  vertical-align: middle;
  background: var(--text-muted);
}
.plot-badge {
  position: absolute;
  top: 14px;
  right: 22px;
  padding: 2px 9px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.05em;
  pointer-events: none;
  background: rgba(8, 12, 18, 0.8);
  border: 1px solid var(--border);
  color: var(--text-muted);
}
.liveness-live {
  color: var(--accent);
  border-color: var(--accent);
}
.liveness-stale,
.liveness-waiting {
  color: var(--warn);
  border-color: var(--warn);
}
/* A single capture in progress: the mode colour, never the amber of waiting or stale. */
.liveness-capturing {
  color: var(--single);
  border-color: var(--single);
}
.plot-zoom-reset {
  position: absolute;
  top: 14px;
  left: 76px;
  font-size: 11px;
  padding: 2px 8px;
  background: rgba(8, 12, 18, 0.8);
}

/* Side panel */
.side-panel {
  border-left: 1px solid var(--border);
  background: var(--surface);
  overflow-y: auto;
  user-select: text;
}
.panel {
  border-bottom: 1px solid var(--border);
}
.panel summary {
  padding: 8px 12px;
  cursor: pointer;
  font-weight: 600;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-muted);
}
.panel-body {
  padding: 0 12px 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.form-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.form-row > label {
  color: var(--text-muted);
}
.form-row select,
.form-row input[type='number'] {
  width: 130px;
}
.form-row.checks {
  justify-content: flex-start;
  gap: 14px;
}
.form-row.checks label {
  display: flex;
  align-items: center;
  gap: 5px;
}
.with-unit {
  display: inline-flex;
  align-items: center;
  gap: 5px;
}
.with-unit input[type='number'] {
  width: 90px;
}
.unit {
  color: var(--text-muted);
  font-size: 12px;
}
.swatch {
  display: inline-block;
  width: 10px;
  height: 3px;
  border-radius: 2px;
}
.swatch.max-hold {
  background: #ff9f43;
}
.swatch.min-hold {
  background: #5aa9ff;
}
.button-row {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.button-row.end {
  justify-content: flex-end;
}
.hint {
  color: var(--text-muted);
  font-size: 12px;
  margin: 0;
}
.error {
  color: var(--danger);
}

.readout-table {
  width: 100%;
  border-collapse: collapse;
  font-family: var(--mono);
  font-size: 12px;
}
.readout-table th {
  text-align: left;
  font-family: var(--font);
  font-weight: 500;
  color: var(--text-muted);
  padding: 2px 4px;
}
.readout-table td {
  padding: 3px 4px;
  border-top: 1px solid var(--border);
  vertical-align: top;
}
.readout-table tbody tr {
  cursor: pointer;
}
.readout-table tbody tr:hover {
  background: var(--surface-2);
}
.readout-table tr.active {
  background: var(--surface-3);
}
.marker-id {
  color: #ff6bcb;
  font-weight: 700;
}
.peak-id {
  color: #ffd166;
  font-weight: 700;
}
.delta {
  color: var(--text-muted);
  font-size: 11px;
}
.row-actions {
  text-align: right;
  white-space: nowrap;
}

/* Parameter forms */
.param-form {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.param-group {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 6px 8px 8px;
  margin: 0;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.param-group legend {
  color: var(--text-muted);
  font-size: 12px;
  padding: 0 4px;
}
.param-field {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.param-field label {
  color: var(--text-muted);
}
.param-field .freq-input {
  width: 140px;
}
.required {
  color: var(--danger);
}

/* Status bar */
.status-bar {
  display: flex;
  gap: 16px;
  padding: 4px 12px;
  background: var(--surface);
  border-top: 1px solid var(--border);
  font-family: var(--mono);
  font-size: 11.5px;
  white-space: nowrap;
  overflow: hidden;
}
.status-label {
  color: var(--text-muted);
  font-family: var(--font);
}
.uncalibrated {
  color: var(--warn);
  margin-left: auto;
}

.plot-hint {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0;
  color: var(--text-muted);
  font-size: 15px;
  pointer-events: none;
  text-align: center;
  padding: 0 40px;
}

/* --- src/styles/capture.css --- */
/* Capture control: a split button (mode label + action icon, chevron opens the mode menu).
   The mode sets the fill colour; the icon, the accessible name and the plot badge carry the action.
   Geometry is fixed (128px main, 26px chevron) so no mode or state moves the toolbar (design.md 3.1). */
.capture {
  position: relative;
  display: flex;
  align-items: stretch;
  flex: none;
  height: var(--control-height);
}
.capture-main,
.capture-chevron {
  height: 100%;
  border-width: 1px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.capture-main {
  width: 128px;
  gap: 7px;
  padding: 0 10px;
  border-radius: var(--radius) 0 0 var(--radius);
  border-right-width: 0;
  font-weight: 600;
}
.capture-chevron {
  width: 26px;
  padding: 0;
  border-radius: 0 var(--radius) var(--radius) 0;
}
.capture-main svg,
.capture-chevron svg {
  flex: none;
}

.capture[data-mode='continuous'] .capture-main,
.capture[data-mode='continuous'] .capture-chevron {
  background: var(--accent);
  border-color: var(--accent);
  color: #062018;
}
.capture[data-mode='single'] .capture-main,
.capture[data-mode='single'] .capture-chevron {
  background: var(--single);
  border-color: var(--single);
  color: var(--single-ink);
}
.capture[data-mode='continuous'] .capture-chevron {
  border-left: 1px solid rgba(6, 32, 24, 0.35);
}
.capture[data-mode='single'] .capture-chevron {
  border-left: 1px solid rgba(18, 10, 36, 0.35);
}
.capture[data-mode='continuous'] .capture-main:hover:not(:disabled):not([aria-disabled='true']),
.capture[data-mode='continuous'] .capture-chevron:hover:not(:disabled):not([aria-disabled='true']) {
  background: var(--accent-strong);
  border-color: var(--accent-strong);
}
.capture[data-mode='single'] .capture-main:hover:not(:disabled):not([aria-disabled='true']),
.capture[data-mode='single'] .capture-chevron:hover:not(:disabled):not([aria-disabled='true']) {
  background: var(--single-strong);
  border-color: var(--single-strong);
}
.capture button:disabled {
  opacity: 0.45;
}

/* One focus ring around the whole split control, drawn on the toolbar surface. A per-segment ring
   would sit on the neighbouring purple or teal fill at about 1.3:1 and disappear. */
.capture .capture-main:focus-visible,
.capture .capture-chevron:focus-visible,
.capture .mode-item:focus-visible {
  outline: none;
}
.capture:has(.capture-main:focus-visible, .capture-chevron:focus-visible) {
  outline: 2px solid var(--info);
  outline-offset: 2px;
  border-radius: var(--radius);
}

/* Acquiring: the main button is a Stop (Pause or cancel), so both segments turn red. Same geometry
   and the same ink contrast as the mode fills; the chevron stays locked (see below). Placed after the
   mode and hover rules so it wins at equal specificity. */
.capture[data-state='acquiring'] .capture-main,
.capture[data-state='acquiring'] .capture-chevron {
  background: var(--danger);
  border-color: var(--danger);
  color: var(--danger-ink);
}
.capture[data-state='acquiring'] .capture-chevron {
  border-left: 1px solid rgba(18, 10, 36, 0.35);
}
.capture[data-state='acquiring'] .capture-main:hover:not(:disabled):not([aria-disabled='true']),
.capture[data-state='acquiring'] .capture-chevron:hover:not(:disabled):not([aria-disabled='true']) {
  background: var(--danger-strong);
  border-color: var(--danger-strong);
}

/* Busy (a command in flight): focusable and not dimmed, so keyboard focus and the tooltip stay. */
.capture-main[aria-disabled='true'] {
  cursor: progress;
}
/* Locked while acquiring or busy: keeps focus and the tooltip, reads as unavailable. */
.capture-chevron[aria-disabled='true'] {
  opacity: 0.55;
  cursor: default;
}
.capture-chevron[aria-expanded='true'] {
  filter: brightness(0.92);
}

/* Mode menu: the same surface, border and radius as .source-popover. */
.mode-popover {
  position: absolute;
  top: calc(100% + 4px);
  right: 0;
  z-index: 20;
  width: 280px;
  padding: 6px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 8px;
  box-shadow: 0 12px 36px rgba(0, 0, 0, 0.5);
}
.mode-heading {
  margin: 6px 8px 4px;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-muted);
}
.mode-popover .mode-item {
  display: grid;
  grid-template-columns: 18px minmax(0, 1fr) 16px;
  column-gap: 10px;
  align-items: start;
  width: 100%;
  padding: 7px 8px;
  background: transparent;
  border-color: transparent;
  border-radius: 6px;
  text-align: left;
  white-space: normal;
}
.mode-popover .mode-item:hover,
.mode-popover .mode-item:focus-visible {
  background: var(--surface-3);
  border-color: transparent;
}
.mode-popover .mode-item:focus-visible {
  outline: 2px solid var(--info);
  outline-offset: -2px;
}
.mode-ico {
  width: 18px;
  height: 18px;
  margin-top: 1px;
}
.mode-ico.continuous {
  color: var(--accent);
}
.mode-ico.single {
  color: var(--single);
}
.mode-name {
  display: block;
  font-weight: 600;
}
.mode-desc {
  display: block;
  font-size: 12px;
  color: var(--text-muted);
}
.mode-check {
  margin-top: 2px;
  color: var(--text);
  visibility: hidden;
}
.mode-item[aria-checked='true'] .mode-check {
  visibility: visible;
}

/* Announcements for screen readers only (the capture live region). */
.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

/* --- src/styles/source.css --- */
/* Source button and menu. Fixed column widths are a contract (see source.css.test.ts):
   the name column of a row never depends on its badge, status text or hover actions. */
.source-control {
  position: relative;
  display: flex;
  flex: 0 1 auto;
  min-width: 150px;
  max-width: 280px;
}
.source-button {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: 1 1 auto;
  min-width: 150px;
  max-width: 280px;
  height: var(--control-height);
}
.source-button.attention {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}
.source-button.attention:focus-visible {
  outline-color: var(--info);
}
.src-name {
  flex: 1 1 auto;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  text-align: left;
}

/* Status glyph: one 10px circle (a bold cross for failed) centred in an 18px cell. */
.src-dot {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 18px;
  height: 16px;
  flex: none;
  color: var(--text-muted);
  line-height: 1;
}
.src-dot[data-status]::before {
  content: '';
  display: block;
  box-sizing: border-box;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--text-muted);
}
.src-dot[data-status='connected']::before,
.src-dot[data-status='acquiring']::before {
  background: var(--accent);
  box-shadow: 0 0 0 2px rgba(62, 224, 181, 0.28);
}
.src-dot[data-status='absent']::before {
  border: 2px solid var(--text-muted);
  background: transparent;
}
.src-dot[data-status='connecting']::before,
.src-dot[data-status='disconnecting']::before {
  background: var(--info);
  animation: src-pulse 1s ease-in-out infinite;
}
.src-dot[data-status='failed'] {
  color: var(--danger);
  font-weight: 700;
  font-size: 13px;
}
.src-dot[data-status='failed']::before {
  content: '✕';
  width: auto;
  height: auto;
  border-radius: 0;
  background: transparent;
}
@keyframes src-pulse {
  0%,
  100% {
    opacity: 1;
  }
  50% {
    opacity: 0.25;
  }
}
@media (prefers-reduced-motion: reduce) {
  .src-dot[data-status='connecting']::before,
  .src-dot[data-status='disconnecting']::before {
    animation: none;
    box-shadow: 0 0 0 2px rgba(90, 169, 255, 0.35);
  }
}
.spinner {
  display: inline-block;
}
.spinner::before {
  content: '⟳';
  display: inline-block;
  animation: spin 1s linear infinite;
}
@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}
@media (prefers-reduced-motion: reduce) {
  .spinner::before {
    content: '…';
    animation: none;
  }
}

.source-popover {
  position: absolute;
  top: calc(100% + 4px);
  left: 0;
  z-index: 20;
  width: 360px;
  min-width: 280px;
  max-width: calc(100vw - 16px);
  max-height: 70vh;
  overflow-x: hidden;
  overflow-y: auto;
  padding: 6px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 8px;
  box-shadow: 0 12px 36px rgba(0, 0, 0, 0.5);
}
.source-menu:focus {
  outline: none;
}
.source-heading {
  margin: 8px 6px 2px;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-muted);
}
.source-heading:first-child {
  margin-top: 2px;
}
.source-yours {
  /* 6 two-line rows, then the list scrolls inside the section */
  max-height: calc(6 * 48px);
  overflow-y: auto;
}
.source-fixed {
  margin-top: 4px;
  padding-top: 4px;
  border-top: 1px solid var(--border);
}

/* A row: line 1 = glyph | name (ellipsis) | badge (fixed 64px); line 2 = status text + detail. */
.source-row {
  position: relative;
}
.source-item {
  display: grid;
  grid-template-columns: 18px minmax(0, 1fr) 64px;
  column-gap: 8px;
  align-items: center;
  width: 100%;
  min-height: 44px;
  padding: 5px 8px;
  background: transparent;
  border-color: transparent;
  text-align: left;
}
.source-item.single {
  min-height: 30px;
  padding-top: 3px;
  padding-bottom: 3px;
}
.source-item:hover:not([aria-disabled='true']),
.source-item:focus-visible {
  background: var(--surface-3);
}
.source-item[aria-disabled='true'] {
  opacity: 0.45;
  cursor: default;
}
.source-item[aria-checked='true'] {
  border-color: var(--border);
}
.source-item.dimmed .src-name {
  color: var(--text-muted);
}
/* Spans both lines of a row so it is centred vertically; fades out while the row's actions show. */
.src-badge {
  grid-column: 3;
  grid-row: 1 / span 2;
  align-self: center;
  width: 64px;
  justify-self: stretch;
  text-align: center;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: clip;
  transition: opacity 150ms ease-out;
}
.source-row:hover .src-badge,
.source-row:has(.source-actions:focus-within) .src-badge {
  opacity: 0;
}
.row-sub {
  grid-column: 2 / 3;
  min-height: 17px;
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
  font-size: 12px;
  color: var(--text-muted);
}
.row-sub .st {
  flex: none;
  white-space: nowrap;
}
.row-sub .st.ok {
  color: var(--accent);
}
.row-sub .st.bad {
  color: var(--danger);
}
.row-sub .st.busy {
  color: var(--info);
}
.row-sub .sep {
  flex: none;
}
.row-sub .detail {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-family: var(--mono);
  font-size: 11px;
}
/* Over the badge column, centred vertically in the row (top/bottom 0 + auto margins, so the
   slide transform is free). Hidden until the row is hovered or one of its buttons has focus.
   Hidden buttons stay focusable (no visibility:hidden, so ArrowLeft/Right reach them) but are
   transparent and non-interactive (pointer-events: none), so clicks reach the row beneath. */
.source-actions {
  position: absolute;
  top: 0;
  bottom: 0;
  /* 1px item border + 8px item padding: lands exactly on the badge column's right edge. */
  right: 9px;
  margin: auto 0;
  width: 64px;
  height: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 2px;
  opacity: 0;
  transform: translateX(-6px);
  pointer-events: none;
  transition:
    opacity 150ms ease-out,
    transform 150ms ease-out;
}
.source-row:hover .source-actions,
.source-actions:focus-within {
  opacity: 1;
  transform: none;
  pointer-events: auto;
}
@media (prefers-reduced-motion: reduce) {
  .source-actions,
  .src-badge {
    transition: none;
  }
  .source-actions {
    transform: none;
  }
}
.source-actions button.icon {
  min-width: 26px;
  min-height: 20px;
  height: 20px;
  padding: 0 5px;
  line-height: 1;
  background: var(--surface-3);
}
.source-actions button.icon:hover {
  border-color: var(--border);
}
.source-item[data-highlight] {
  animation: src-fresh 3s ease-out;
}
@keyframes src-fresh {
  0%,
  70% {
    background: rgba(62, 224, 181, 0.16);
    border-color: var(--accent);
  }
  100% {
    background: transparent;
  }
}
@media (prefers-reduced-motion: reduce) {
  .source-item[data-highlight] {
    animation: none;
    outline: 2px solid var(--accent);
    outline-offset: -2px;
  }
}
.source-toast {
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 44px;
  padding: 0 8px;
  color: var(--text-muted);
}
.source-toast button {
  min-height: 26px;
  color: var(--info);
}
.source-note {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 10px;
  font-size: 12px;
  color: var(--text-muted);
}
.source-form {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 4px;
}
.source-form-header {
  display: flex;
  align-items: center;
  gap: 10px;
}
.source-form .error {
  margin: 0;
}

/* ===== 2. Prototype page chrome (not app code) ===== */

main { padding: 14px 18px 60px; max-width: 1480px; margin: 0 auto; }

main p.intro { color: #8a9ab1; margin: 0 0 10px; max-width: 980px; font-size: 12px; }
.cell-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.cell { background: #121a26; border: 1px solid #26344a; border-radius: 6px; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }

.sw { display: flex; flex-direction: column; gap: 4px; }
.sw .chip { height: 44px; border-radius: 6px; border: 1px solid #26344a; }

.sw .u { font-size: 11px; color: #8a9ab1; }
.scale-bar { height: 12px; background: #3ee0b5; border-radius: 2px; }
.radius-s { width: 90px; height: 44px; background: #1f2b3f; border: 1px solid #26344a; }

/* Before/after cards for the small fixes */
.fix { background: #121a26; border: 1px solid #26344a; border-radius: 8px; padding: 12px 14px; margin: 0 0 14px; }

/* Screens */
.frame-wrap { margin: 0 0 18px; }
.frame-wrap .tag { font-size: 12px; color: #8a9ab1; margin-bottom: 4px; }

.frame { position: relative; width: var(--fw, 1024px); height: 600px; overflow: hidden; border: 1px solid #26344a; border-radius: 6px; background: #0b1018; }
.frame-app { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto 1fr auto; height: 100%; }

/* Screens: narrow-window media query mirrored for a frame of any width (the viewport is not the frame) */
.frame.is-narrow .toolbar { gap: 10px; padding-left: 8px; padding-right: 8px; }
.frame.is-narrow .toolbar-group, .frame.is-narrow .field { gap: 5px; }
.frame.is-narrow .toolbar .freq-input { width: 128px; }

/* Mirrors of :hover / :focus-visible / open states, so the gallery can show them without input */
.st-hover:not(:disabled):not([aria-disabled='true']) { border-color: #3a4d6b; background: #25344c; }
button.st-hover.primary:not(:disabled) { background: var(--accent-strong); border-color: var(--accent-strong); }
.st-focus { outline: 2px solid var(--info); outline-offset: 1px; }

.mode-popover .mode-item.st-focus { background: var(--surface-3); outline: 2px solid var(--info); outline-offset: -2px; }
.mode-popover .mode-item.st-hover { background: var(--surface-3); }
.capture-main.st-hover:not([aria-disabled='true']), .capture-chevron.st-hover:not([aria-disabled='true']) { background: var(--accent-strong); border-color: var(--accent-strong); }
.capture.st-ring { outline: 2px solid var(--info); outline-offset: 2px; border-radius: var(--radius); }
.force-actions .source-actions { opacity: 1; transform: none; pointer-events: auto; }
.force-actions .src-badge { opacity: 0; }
.st-dim .src-name { color: var(--text-muted); }

/* ===== 3. PROPOSED small fixes (DESIGN.md / design.md section 7 mapping). Scoped to .v-new so both can sit side by side. ===== */
/* F1 toolbar fields share the 30px control height */
.v-new .toolbar .freq-input, .v-new .toolbar select { height: var(--control-height); }
/* F2 small and icon buttons reach a 24px target height */
.v-new button.small { min-height: 24px; padding: 2px 8px; }
.v-new button.icon { min-height: 24px; min-width: 24px; }
.v-new .source-actions { height: 24px; }
.v-new .source-actions button.icon { height: 24px; min-height: 24px; }
/* F3 menu group headings start on the glyph column (1px border + 6px popover padding + 1px item border + 8px item padding) */
.v-new .source-heading { margin-left: 9px; }
.v-new .mode-heading { margin-left: 9px; }
/* F4 mode-menu focus ring is drawn outside the item, like every other control */
.v-new .mode-popover .mode-item.st-focus, .v-new .mode-popover .mode-item:focus-visible { outline-offset: 1px; }
/* F5 status bar text on the 11px step of the type scale */
.v-new .status-bar { font-size: 11px; }
/* F6 dialog help text on the 12px hint step */
.v-new .source-dialog .help { font-size: 12px; }
/* F7 dialog field labels on the 13px label step (toolbar, side panel and inline form already use 13px) */
.v-new .source-dialog .form-row label, .v-new .source-dialog .param-field label { font-size: 13px; }
/* F8 inline error text on the 12px step, same as the dialog's error text */
.v-new .source-form .error { font-size: 12px; }
/* F9 one unavailable value (0.6) for buttons, fields, rows and the locked chevron; read-only stays 0.75 */
.v-new button:disabled, .v-new input:disabled, .v-new select:disabled, .v-new .capture button:disabled,
.v-new .source-item[aria-disabled='true'], .v-new .capture-chevron[aria-disabled='true'] { opacity: 0.6; }
/* F13 zoom reset button reaches the 24px target height */
.v-new .plot-zoom-reset { min-height: 24px; display: inline-flex; align-items: center; }
/* F14 checkbox label is the target: at least 24px tall */
.v-new .form-row.checks label { min-height: 24px; }
/* F15 text fields, number fields and selects get a 3:1 boundary (#5b6f8f, 3.43:1 on the panel) */
.v-new input[type='number'], .v-new input[type='text'], .v-new select, .v-new .freq-input { border-color: #5b6f8f; }
/* F11 amber banner tint on the same 12% as the red banner tint */
.v-new .notice { background: rgba(255, 181, 71, 0.12); }
.v-new .notice-deviceLost, .v-new .notice-connectFailed, .v-new .notice-internal, .v-new .notice-command { background: rgba(255, 107, 107, 0.12); }
/* F0 (proposal, not a small fix): Rate and Frame are removed whole when they do not fit; Uncalibrated stays right aligned and is never removed.
   Thresholds measured with the fallback fonts: Frame needs 1258px, Rate needs 1078px (after Frame is gone). */
.v-new .frame-narrow-hide [data-low], .v-new.frame-narrow-hide [data-low] { display: none; }
/* F11 dialog group legend aligned with the field labels (legend padding was 0 4px) */
.v-new .source-dialog .param-group legend { padding: 0; }

<main id="app"></main>
<script>
/* ---------- scenario data (sample content only; no real device data) ---------- */
const DEV = 'SA430 08FF41E50F8B3A34';
const LONG = 'Bench analyser, 2.4 GHz survey, rig A, SA430 near the window';
const SCEN = {
  empty: {
    label: 'Empty: nothing connected', conn: 'disconnected', mode: 'continuous', frame: false, notice: null,
    src: null,
    rows: [],
    detected: [{ title: DEV, badge: 'USB', detail: '/dev/ttyACM0', status: 'idle' }],
    dialogName: '', testText: 'idle', fail: null,
  },
  typical: {
    label: 'Typical: SA430 acquiring', conn: 'acquiring', mode: 'continuous', frame: true, notice: null,
    src: { title: 'Bench SA430', badge: 'USB', detail: '/dev/ttyACM0', status: 'acquiring' },
    rows: [{ title: 'Bench SA430', badge: 'USB', detail: '/dev/ttyACM0', status: 'acquiring', checked: true }],
    detected: [{ title: DEV, badge: 'USB', detail: '/dev/ttyACM1', status: 'idle', isNew: true }],
    dialogName: 'Bench SA430', testText: 'ok', fail: null,
  },
  long: {
    label: 'Long text: 60-character name, long port', conn: 'acquiring', mode: 'single', frame: true, notice: null,
    src: { title: LONG, badge: 'USB', detail: '/dev/serial/by-id/usb-SA430_' + DEV + '-if00', status: 'acquiring' },
    rows: [
      { title: LONG, badge: 'USB', detail: '/dev/serial/by-id/usb-SA430_' + DEV + '-if00', status: 'acquiring', checked: true },
      { title: 'Lab bench SA430 by the north window, run 07', badge: 'USB', detail: '/dev/serial/by-id/usb-SA430_' + DEV + '-if00', status: 'absent' },
    ],
    detected: [{ title: DEV, badge: 'USB', detail: '/dev/ttyACM1', status: 'idle', isNew: true }],
    dialogName: LONG, testText: 'ok', fail: null,
  },
  error: {
    label: 'Error: connect failed', conn: 'disconnected', mode: 'continuous', frame: false,
    notice: { kind: 'connectFailed', msg: 'Connection failed: could not open /dev/ttyACM0 (permission denied). Add your user to the dialout group, then reconnect.' },
    src: { title: 'Bench SA430', badge: 'USB', detail: '/dev/ttyACM0', status: 'failed' },
    rows: [{ title: 'Bench SA430', badge: 'USB', detail: '/dev/ttyACM0', status: 'failed', checked: true }],
    detected: [],
    dialogName: 'Bench SA430', testText: 'fail', fail: 'no response from the device on /dev/ttyACM0 after 3 s. Check the cable and that no other program has the port open.',
  },
};
let sc = 'typical', view = 'tokens', fw = 1024, openMenu = null;

const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const S = () => SCEN[sc];
const STATUS_TEXT = { connected: 'Connected', acquiring: 'Acquiring', connecting: 'Connecting…', disconnecting: 'Disconnecting…', failed: 'Failed', absent: 'Not detected', idle: '' };
const TONE = { connected: 'ok', acquiring: 'ok', failed: 'bad', connecting: 'busy', disconnecting: 'busy' };

/* ---------- component renderers (markup follows src/components; class names are the app's) ---------- */
function dot(status) { return `<span class="src-dot" data-status="${status}" aria-hidden="true"></span>`; }
function freq(val, disabled, invalid) {
  return `<label class="field"><span>Center</span><input class="freq-input${invalid ? ' invalid' : ''}" aria-label="Center frequency" value="${esc(val)}"${disabled ? ' disabled' : ''} aria-invalid="${!!invalid}"></label>`;
}
function span(disabled) {
  return `<label class="field"><span>Span</span><select aria-label="Span"${disabled ? ' disabled' : ''}><option>2.048 MHz</option><option>10 MHz</option></select></label>`;
}

function renderFixes() {
  return `<h2>Proposed small fixes: current vs proposed</h2>
  <p class="intro">Each card renders the same element twice: left as it is in src/styles today, right with the proposed change applied (scoped to <code>.v-new</code>, the rules are in this file's section 3). The numbers under each pane are measured by the browser from the rendered CSS, not typed in. Nothing here is a redesign; each fix is a token or a single rule. The list is the one in design.md section 3 (F1 to F15); F0 is a separate finding that needs a decision.</p>
  ${FIXES.map((f) => `<section class="fix" id="${f.id}" data-fix="${f.id}">
    <h3>${f.id} · ${esc(f.title)}</h3>
    <div class="meta">Affected: ${esc(f.screens)}</div>
    <p class="why">${esc(f.why)}</p>
    <div class="ba${f.stack ? ' stack' : ''}">
      <div class="pane"><div class="tag">Current</div><div class="body v-cur" data-cur="${f.id}"></div><div class="out" data-out-cur="${f.id}"></div></div>
      <div class="pane new"><div class="tag">Proposed</div><div class="body v-new" data-new="${f.id}"></div><div class="out" data-out-new="${f.id}"></div></div>
    </div>
  </section>`).join('')}
  <section class="fix" id="F0" data-fix="F0"><h3>F0 · Not a small fix: the status bar cuts "Uncalibrated" from 1024 to 1257px (measured)</h3>
    <div class="meta">Affected: status bar with a live frame, every window width from 1024 to 1257px. Needs a human decision (Q-1); a bug candidate.</div>
    <p class="why">The status bar is one line and it clips at its right edge. "Uncalibrated" sits at the right end (margin-left: auto), so when the items overflow it is pushed outside the bar: the calibration state is not shown at all. Measured with the real CSS and the fallback fonts: all 10 items need 1258px of window width, so from 1024 to 1257px the calibration state is hidden (1180px included). CLAUDE.md says uncalibrated data must never look calibrated. Proposal on the right: Rate and Frame are removed whole when they do not fit (Frame first, then Rate), Uncalibrated and Unit are never removed, and no item is cut. Without Frame, Uncalibrated is visible from 1078px; without Frame and Rate it is visible at 1024px (both measured). The order is Q-4 in DESIGN.md.</p>
    <div class="ba stack">
      <div class="pane"><div class="tag">Current, 1024px</div><div class="body" style="width:1000px" data-cur="F0"></div><div class="out" data-out-cur="F0"></div></div>
      <div class="pane new"><div class="tag">Proposed, 1024px</div><div class="body v-new frame-narrow-hide" style="width:1000px" data-new="F0"></div><div class="out" data-out-new="F0"></div></div>
    </div>
  </section>`;
}
function renderFixSamples() {
  for (const f of FIXES) {
    const s = SCEN[f.scen];
    for (const side of ['cur', 'new']) {
      const host = document.querySelector(`[data-${side}="${f.id}"]`);
      if (!host) continue;
      host.innerHTML = f.render(side);
    }
  }
  // F0: the full status bar, with and without the proposed order
  for (const side of ['cur', 'new']) {
    const host = document.querySelector(`[data-${side}="F0"]`);
    if (host) host.innerHTML = `<div style="width:1000px">${statusBar(SCEN.typical)}</div>`;
  }
  // F3 needs a popover that is not absolutely positioned inside a pane
  for (const side of ['cur', 'new']) {
    const host = document.querySelector(`[data-${side}="F3"]`);
    if (host) host.innerHTML = `<div style="position:relative;top:0;width:340px">${sourceMenu({ ...SCEN.typical, detected: [] }, {}).replace('class="source-popover"', 'class="source-popover" style="position:relative;top:0;width:340px"')}</div>`;
  }
  for (const side of ['cur', 'new']) {
    const host = document.querySelector(`[data-${side}="F4"]`);
    if (host) host.innerHTML = modeMenu({ mode: 'continuous' }, { focus: 'single' }).replace('class="mode-popover"', 'class="mode-popover" style="position:relative;right:auto;top:0;width:280px"');
  }
  for (const side of ['cur', 'new']) {
    const host = document.querySelector(`[data-${side}="F5"]`);
    if (host) host.innerHTML = `<div style="width:100%">${statusBar(SCEN.typical)}</div>`;
  }
  for (const side of ['cur', 'new']) {
    const host = document.querySelector(`[data-${side}="F6"]`);
    if (host) host.innerHTML = dialog({ ...SCEN.typical, testText: 'idle' }, { static: true });
    const h2 = document.querySelector(`[data-${side}="F7"]`);
    if (h2) h2.innerHTML = dialog({ ...SCEN.typical, testText: 'idle' }, { static: true });
  }
  // measurements: after layout, read the rendered styles
  for (const f of FIXES) {
    for (const side of ['cur', 'new']) {
      const host = document.querySelector(`[data-${side}="${f.id}"]`);
      const out = document.querySelector(`[data-out-${side}="${f.id}"]`);
      if (!host || !out) continue;
      try {
        out.textContent = f.measure ? f.measure(host) : '';
      } catch (e) {
        out.textContent = 'measure error: ' + e.message;
      }
    }
  }
  const f0 = (side) => {
    const bar = document.querySelector(`[data-${side}="F0"] .status-bar`);
    const unc = document.querySelector(`[data-${side}="F0"] .uncalibrated`);
    const out = document.querySelector(`[data-out-${side}="F0"]`);
    if (!bar || !unc || !out) return;
    const b = bar.getBoundingClientRect(), u = unc.getBoundingClientRect();
    const visible = u.left < b.right && u.right > b.left;
    const barRight = b.right;
    const lastVisible = [...bar.querySelectorAll('.status-item')].filter((el) => {
      const r = el.getBoundingClientRect(); return r.right <= barRight + 0.5 && r.width > 0;
    }).length;
    const total = bar.querySelectorAll('.status-item').length;
    const shown = [...bar.querySelectorAll('.status-item')].filter((el) => el.getBoundingClientRect().width > 0).length;
    out.textContent = `bar width: ${px(b.width)}\n"Uncalibrated" visible in the bar: ${visible ? 'yes' : 'NO (clipped)'}\nitems in the bar: ${shown} of ${total} (whole items only)\nitems cut by the edge: ${shown - lastVisible}`;
  };
  f0('cur');
  f0('new');
}

function renderScreens() {
  const s = S();
  const fwVar = `--fw:${fw}px`;
  const narrow = fw <= 1180 ? ' is-narrow' : '';
  const menu = openMenu;
  const dlgOpen = openMenu === 'dialog';
  const sourceOpen = openMenu === 'source';
  const modeOpen = openMenu === 'mode';
  const frame = (variant) => {
    const cls = variant === 'new' ? 'v-new' : 'v-cur';
    let inner = appFrame(s, { openSource: sourceOpen, menu: modeOpen });
    if (sourceOpen) inner += `<div style="position:absolute;left:12px;top:42px;z-index:20">${sourceMenu(s)}</div>`;
    if (modeOpen) inner += `<div style="position:absolute;right:${fw - 395}px;top:42px;z-index:20">${modeMenu(s)}</div>`;
    if (dlgOpen) inner += `<div class="dialog-backdrop" style="position:absolute;inset:0;z-index:40;background:rgba(5,8,14,.6);padding:90px 12px 12px">${dialog(s).replace('<div class="dialog-backdrop" style="">', '')}</div>`;
    return `<div class="frame${narrow}" style="${fwVar}"><div class="${cls}" style="height:100%">${inner}</div></div>`;
  };
  return `<h2>Screens at the chosen width</h2>
  <p class="intro">The whole app shell with the current CSS (left) and with the small fixes applied (right), at the width chosen above. Use the menu switches to open the source menu, the capture mode menu or the dialog. The viewport width does not drive the frame width, so the narrow-window rules are mirrored onto frames narrower than 1180px.</p>
  <div class="cell-grid" style="grid-template-columns:1fr;gap:6px">
    <div class="ex" style="gap:6px"><span class="muted" style="font-size:12px">Overlay:</span>
      <button type="button" data-ov="none" aria-pressed="${!menu}">None</button>
      <button type="button" data-ov="source" aria-pressed="${sourceOpen}">Source menu</button>
      <button type="button" data-ov="mode" aria-pressed="${modeOpen}">Capture mode menu</button>
      <button type="button" data-ov="dialog" aria-pressed="${dlgOpen}">Edit source dialog</button>
    </div>
  </div>
  <div class="frame-wrap"><div class="tag"><b>Current</b> (src/styles as they are)</div>${frame('cur')}</div>
  <div class="frame-wrap"><div class="tag"><b>Proposed</b> (small fixes F1 to F15 applied; F0 is a decision, not applied here)</div>${frame('new')}</div>`;
}

/* ---------- switcher ---------- */
function setHash() {
  history.replaceState(null, '', `#view=${view}&s=${sc}&w=${fw}&ov=${openMenu || 'none'}`);
}
function readHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.get('view')) view = p.get('view');
  if (p.get('s') && SCEN[p.get('s')]) sc = p.get('s');
  if (p.get('w')) fw = Number(p.get('w')) || fw;
  if (p.get('ov')) openMenu = p.get('ov') === 'none' ? null : p.get('ov');
}
function render() {
  readHash();
  document.querySelectorAll('[role=tab]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.view === view)));
  document.querySelectorAll('[data-sc]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.sc === sc)));
  document.querySelectorAll('[data-w]').forEach((b) => b.setAttribute('aria-pressed', String(Number(b.dataset.w) === fw)));
  document.getElementById('widthGrp').style.display = view === 'screens' ? '' : 'none';
  document.getElementById('scNote').textContent = S().label + (view === 'screens' ? ` · ${fw}px` : '');
  const app = document.getElementById('app');
  if (view === 'tokens') app.innerHTML = renderTokens();
  else if (view === 'components') app.innerHTML = renderComponents();
  else if (view === 'fixes') { app.innerHTML = renderFixes(); renderFixSamples(); }
  else app.innerHTML = renderScreens();
  setHash();
}
document.addEventListener('click', (e) => {
  const t = e.target.closest('button');
  if (!t) return;
  if (t.dataset.view) { view = t.dataset.view; render(); }
  else if (t.dataset.sc) { sc = t.dataset.sc; render(); }
  else if (t.dataset.w) { fw = Number(t.dataset.w); render(); }
  else if (t.dataset.ov) { openMenu = t.dataset.ov === 'none' ? null : t.dataset.ov; render(); }
});
window.addEventListener('hashchange', render);
render();
</script>
</body>
</html>
